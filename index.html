<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fortuneo Banque - Espace Client</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ==========================
     PAGE CONNEXION
========================== -->


<div id="login-page">


<div class="login-box">


<h1>
Fortuneo Banque
</h1>


<p>
Connexion à votre espace client
</p>



<label>
Identifiant
</label>

<input 
id="username"
type="text"
placeholder="Identifiant">



<label>
Mot de passe
</label>

<input
id="password"
type="password"
placeholder="Mot de passe">



<button id="login-btn">
Se connecter
</button>



<p id="login-error"></p>


</div>


</div>








<!-- ==========================
     ESPACE CLIENT
========================== -->


<div id="client-space" class="hidden">



<header>


<div class="user-box">


<div class="avatar" id="avatar">
EG
</div>


<div>

<h3 id="client-name">
Client
</h3>


<span>
Espace personnel
</span>


</div>


</div>




<button id="logout-btn">
Déconnexion
</button>


</header>









<main>





<!-- ACCUEIL -->


<section 
id="home-page"
class="page active">


<div class="balance-card">


<p>
Solde disponible
</p>


<h1 id="balance">
0 €
</h1>


<span id="status">
Compte disponible
</span>


</div>







<div class="quick-menu">


<button onclick="openPage('accounts-page')">
💳
<br>
Comptes
</button>


<button onclick="openPage('history-page')">
📄
<br>
Historique
</button>



<button onclick="openPage('transfer-page')">
↔️
<br>
Virement
</button>



<button onclick="openPage('card-page')">
💳
<br>
Carte
</button>



</div>








<div class="box">


<h2>
Dernières opérations
</h2>


<div id="last-operations">

</div>


</div>


</section>









<!-- COMPTES -->


<section 
id="accounts-page"
class="page">


<h2>
Mes comptes
</h2>


<div class="box" id="account-info">

</div>


</section>









<!-- HISTORIQUE -->


<section
id="history-page"
class="page">


<h2>
Historique
</h2>


<div class="box">


<input 
id="search"
placeholder="Rechercher">


<div id="operations">

</div>


</div>


</section>









<!-- VIREMENT -->


<section
id="transfer-page"
class="page">


<h2>
Nouveau virement
</h2>



<div class="box">


<label>
Bénéficiaire
</label>


<input id="beneficiary">



<label>
IBAN
</label>


<input id="iban">



<label>
Montant
</label>


<input 
id="amount"
type="number">



<label>
Motif
</label>


<input id="reason">



<button id="send-transfer">
Envoyer
</button>



<p id="transfer-result"></p>


</div>


</section>









<!-- CARTE -->


<section
id="card-page"
class="page">


<h2>
Ma carte bancaire
</h2>



<div class="bank-card">


<h3>
Fortuneo
</h3>


<div class="chip"></div>



<h2>
**** **** **** 
<span id="card-number">
0000
</span>
</h2>



<p id="card-name">

</p>



<p id="card-date">

</p>


</div>


</section>






</main>










<!-- MENU BAS -->


<nav>


<button onclick="openPage('home-page')">
🏠
<br>
Accueil
</button>



<button onclick="openPage('accounts-page')">
💳
<br>
Comptes
</button>



<button onclick="openPage('history-page')">
📄
<br>
Historique
</button>



<button onclick="openPage('card-page')">
👤
<br>
Carte
</button>



</nav>






</div>







<script src="script.js"></script>


</body>

</html>
